name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '0 15 */1 * *' # 15UTC (9 America/Sao_Paulo) every day

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Browser build is tied to the playwright version, so key on the lockfile.
      - name: Restore playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Installs pnpm (from packageManager) and node (from devEngines.runtime / .nvmrc).
      - name: Setup pnpm and node
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
